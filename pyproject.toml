[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowram-ai"
version = "0.2.0"
description = "Memory-budgeted GGUF Llama inference for constrained devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "Apache-2.0"}
authors = [{name = "LowRAM AI contributors"}]

[project.scripts]
lowram-ai = "lowram_ai.cli:main"

[tool.setuptools.packages.find]
include = ["lowram_ai*"]
exclude = ["lowram_ai.tests*"]
